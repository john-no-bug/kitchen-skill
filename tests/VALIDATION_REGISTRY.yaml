release_candidate:
  name: v0.8.1
  status: validated_release
  tracking_issue: 7
  base_product_commit: a0a8979e412ab254eb9095b9d5ccf21747bc8c63
  composite_tested_commit: d3c1fac7ea4de7e3d83dd198ce9799d82ed7c81b
  composite_result_comment: 5441221465
  cleanup_comment: 5441226472
  static_validation_run: 33083694868
  release_record: docs/RELEASE_v0.8.1.md
  release_freeze_commit: d0f3edf032696a7459ff20bdb996fe1d46c7ad59
  required_static_validation: true
  required_composite_suite: tests/release/manifest.yaml
  validated_conditions:
    - static_validation_pass
    - composite_gate_pass
    - canonical_active_task_shape_pass
    - cleanup_verified
    - registry_status_validated_release
    - release_docs_synchronized

active_probes:
  notion_plugin_conformance:
    status: pending_web_and_codex_results
    issue: 9
    matrix: tests/notion/capability_matrix.yaml
    web_prompt: demo/NOTION_WEB_CAPABILITY_PROMPT.md
    codex_prompt: demo/NOTION_CODEX_CAPABILITY_PROMPT.md
    connector_required: false

rules:
  - A gate result may be inherited only when its declared inheritance guard still matches.
  - A documentation/test/CI/distribution-only commit may inherit guarded product evidence when product blobs are unchanged.
  - Root SKILL.md is intentionally allowed to change as a public bootstrap without changing the validated Pure Web product blob.
  - A product-bearing change to a guarded file invalidates inherited evidence for that gate until rerun.
  - Issue closure alone is not a replacement for exact tested commit and evidence identity.
  - GitHub connector access is never an end-user Kitchen Skill runtime requirement.
  - validated_release means the composite tested commit passed and subsequent non-product changes preserve guarded product identities with static validation passing.
