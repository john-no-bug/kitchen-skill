  validated_addendum: docs/Kitchen_System_v0.8_Validated_Baseline.md
  release_record: docs/RELEASE_v0.8.1.md

distribution:
  public_bootstrap:
    status: active
    entrypoint: SKILL.md
    manifest: dist/deployments.yaml
    connector_required: false
    preferred_transport: public_web_http
    fallback_transport:
      - installed_skill_or_app
      - user_supplied_copy
    rule: >-
      Root SKILL.md is a distribution bootstrap. Product validation attaches to
      the selected dist artifact, not to bootstrap/product blob equality.

