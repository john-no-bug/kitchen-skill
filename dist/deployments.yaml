version: 2

bootstrap:
  status: active_public_loader
  entrypoint: SKILL.md
  rendered_url: https://github.com/john-no-bug/kitchen-skill/blob/main/SKILL.md
  raw_url: https://raw.githubusercontent.com/john-no-bug/kitchen-skill/main/SKILL.md
  selection_manifest: dist/deployments.yaml
  connector_required: false
  transport_priority:
    - public_web_http
    - installed_skill_or_app
    - user_supplied_copy

deployments:
  pure_web:
    status: validated_fallback
    runtime: WEB_CHAT
    storage: CONTEXT_ONLY
    entrypoint: dist/KITCHEN_SKILL_WEB_LIVE_COOKING.md
    distribution: dist/KITCHEN_SKILL_WEB_LIVE_COOKING.md
    validation_gate: 1
    validated_blob: 37a8d15bb376579a9a33ede514b121dff04c249d
    capabilities:
      - live_cooking
      - session_context_only

  web_google_drive_v08:
    status: validated_release
    release_version: v0.8.1
    runtime: WEB_CHAT
    storage: GoogleDriveProvider
    entrypoint: dist/KITCHEN_SKILL_WEB_GOOGLE_DRIVE_SHOPPING_COOKING_V08.md
    component_validation_gate: 6
    release_gate: 7
    base_product_commit: a0a8979e412ab254eb9095b9d5ccf21747bc8c63
    composite_tested_commit: d3c1fac7ea4de7e3d83dd198ce9799d82ed7c81b
    release_result_comment: 5441221465
    cleanup_comment: 5441226472
    release_record: docs/RELEASE_v0.8.1.md
    capabilities:
      - live_cooking
      - shopping
      - durable_shared_state
      - fresh_session_continuity
      - canonical_active_task_persistence
      - provider_degradation_retry
      - event_experience_compaction
      - bounded_long_history_context

historical_bundles:
  - path: dist/KITCHEN_SKILL_WEB_GOOGLE_DRIVE_LIVE_COOKING.md
    milestone: v0.6
  - path: dist/KITCHEN_SKILL_WEB_GOOGLE_DRIVE_SHOPPING_COOKING.md
    milestone: v0.7

rules:
  - Root SKILL.md is a public capability bootstrap, not a product bundle.
  - Normal users must not need a GitHub connector to load public Kitchen Skill instructions.
  - The validated Pure Web artifact is dist/KITCHEN_SKILL_WEB_LIVE_COOKING.md and retains its validated blob identity independently of the bootstrap.
  - web_google_drive_v08 is the validated durable Web deployment only while Issue #7 release evidence and validation-registry blob guards remain valid.
  - Product-bearing changes to guarded files require the relevant validation gate to be rerun before retaining validated_release status.
  - Experimental Notion capability probes are not deployment identities.
  - Historical bundles remain available for rollback/debugging and are not the latest durable deployment identity.
